name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Deploy build to GitHub Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Create a PAT in the PushpendraKS account and grant access only to:
          # PushpendraKS/pushpendraks.github.io with Contents: Read and write
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: PushpendraKS/pushpendraks.github.io
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
          user_name: PushpendraKS
          user_email: push.ks24@gmail.com
