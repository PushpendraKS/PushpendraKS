name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React Vite Project
        run: npm run build

      - name: Deploy built site to GitHub Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          # DEPLOY_TOKEN must be a PAT created by PushpendraKS and scoped to access:
          # PushpendraKS/pushpendraks.github.io with Contents: Read and write
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: PushpendraKS/pushpendraks.github.io
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
          user_name: Pushpendra
          user_email: push.ks24@gmail.com
